plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        name = 'SmartBrainLib'
        url = 'https://dl.cloudsmith.io/public/tslat/sbl/maven/'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter { includeGroupAndSubgroups('com.geckolib') }
    }
    mavenCentral()
}

base {
    archivesName = mod_id
}


java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    interfaceInjectionData.from "interfaces.json"

    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        client2 {
            client()
            programArguments.addAll '--username', 'Dev2'
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

def localJolt = file("src/main/native/jolt-jni-6.0.0.jar")

dependencies {
    implementation "net.tslat:smartbrainlib-neoforge-${minecraft_version}:${sbl_version}"
    implementation "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    implementation("com.github.stephengold:jolt-jni-Windows64:6.0.0")
    jarJar(implementation(files(localJolt)))
    runtimeOnly("com.github.stephengold:jolt-jni-Windows64:6.0.0:DebugSp")
    jarJar(compileOnly("com.github.stephengold:jolt-jni-Windows64:6.0.0:ReleaseSp")) {
        version {
            prefer '6.0.0'
        }
    }
    implementation("com.github.stephengold:jolt-jni-Linux64:6.0.0")
    runtimeOnly("com.github.stephengold:jolt-jni-Linux64:6.0.0:DebugSp")

    jarJar(implementation("io.github.electrostat-lab:snaploader:1.1.1-stable")) {
        version {
            prefer '1.1.1-stable'
        }
    }
    runtimeOnly("com.github.oshi:oshi-core:6.9.0")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register("generateStickyNoteModels") {
    group = "generation"
    description = "Generates sticky note model JSON files"

    def modelDir = layout.projectDirectory.dir("src/main/resources/assets/bittermelon/models/block/sticky_note")

    doLast {
        File modelDirFile = modelDir.asFile
        modelDirFile.mkdirs()

        // Wall models
        def wallSegments = [
                [ // 0: bottom-left
                  from : [8, 0, 15.75],
                  to   : [16, 8, 15.75],
                  faces: [
                          north: [uv: [0, 8, 8, 16], texture: "#texture"],
                          south: [uv: [0, 8, 8, 16], texture: "#texture"]
                  ]
                ],
                [ // 1: bottom-right
                  from : [0, 0, 15.75],
                  to   : [8, 8, 15.75],
                  faces: [
                          north: [uv: [8, 8, 16, 16], texture: "#texture"],
                          south: [uv: [8, 8, 16, 16], texture: "#texture"]
                  ]
                ],
                [ // 2: top-left
                  from : [8, 8, 15.75],
                  to   : [16, 16, 15.75],
                  faces: [
                          north: [uv: [0, 0, 8, 8], texture: "#texture"],
                          south: [uv: [0, 0, 8, 8], texture: "#texture"]
                  ]
                ],
                [ // 3: top-right
                  from : [0, 8, 15.75],
                  to   : [8, 16, 15.75],
                  faces: [
                          north: [uv: [8, 0, 16, 8], texture: "#texture"],
                          south: [uv: [8, 0, 16, 8], texture: "#texture"]
                  ]
                ]
        ]

        // Floor models
        def floorSegments = [
                [ // 0: bottom-left
                  from : [0, 0.25, 8],
                  to   : [8, 0.25, 16],
                  faces: [
                          up  : [uv: [0, 8, 8, 16], texture: "#texture"],
                          down: [uv: [0, 8, 8, 16], texture: "#texture"]
                  ]
                ],
                [ // 1: bottom-right
                  from : [8, 0.25, 8],
                  to   : [16, 0.25, 16],
                  faces: [
                          up  : [uv: [8, 8, 16, 16], texture: "#texture"],
                          down: [uv: [8, 8, 16, 16], texture: "#texture"]
                  ]
                ],
                [ // 2: top-left
                  from : [0, 0.25, 0],
                  to   : [8, 0.25, 8],
                  faces: [
                          up  : [uv: [0, 0, 8, 8], texture: "#texture"],
                          down: [uv: [0, 0, 8, 8], texture: "#texture"]
                  ]
                ],
                [ // 3: top-right
                  from : [8, 0.25, 0],
                  to   : [16, 0.25, 8],
                  faces: [
                          up  : [uv: [8, 0, 16, 8], texture: "#texture"],
                          down: [uv: [8, 0, 16, 8], texture: "#texture"]
                  ]
                ]
        ]

        // Ceiling models
        def ceilingSegments = [
                [ // 0: bottom-left
                  from : [0, 15.75, 8],
                  to   : [8, 15.75, 16],
                  faces: [
                          up  : [uv: [0, 8, 8, 16], texture: "#texture"],
                          down: [uv: [0, 8, 8, 16], texture: "#texture"]
                  ]
                ],
                [ // 1: bottom-right
                  from : [8, 15.75, 8],
                  to   : [16, 15.75, 16],
                  faces: [
                          up  : [uv: [8, 8, 16, 16], texture: "#texture"],
                          down: [uv: [8, 8, 16, 16], texture: "#texture"]
                  ]
                ],
                [ // 2: top-left
                  from : [0, 15.75, 0],
                  to   : [8, 15.75, 8],
                  faces: [
                          up  : [uv: [0, 0, 8, 8], texture: "#texture"],
                          down: [uv: [0, 0, 8, 8], texture: "#texture"]
                  ]
                ],
                [ // 3: top-right
                  from : [8, 15.75, 0],
                  to   : [16, 15.75, 8],
                  faces: [
                          up  : [uv: [8, 0, 16, 8], texture: "#texture"],
                          down: [uv: [8, 0, 16, 8], texture: "#texture"]
                  ]
                ]
        ]

        for (int i = 0; i <= 15; i++) {
            String binary = Integer.toBinaryString(i).padLeft(4, '0')
            def activeWallElements = []
            def activeFloorElements = []
            def activeCeilingElements = []

            if (binary[0] == '1') { // 1000: top-left
                activeWallElements.add(wallSegments[2])
                activeFloorElements.add(floorSegments[2])
                activeCeilingElements.add(ceilingSegments[2])
            }
            if (binary[1] == '1') { // 0100: top-right
                activeWallElements.add(wallSegments[3])
                activeFloorElements.add(floorSegments[3])
                activeCeilingElements.add(ceilingSegments[3])
            }
            if (binary[2] == '1') { // 0010: bottom-left
                activeWallElements.add(wallSegments[0])
                activeFloorElements.add(floorSegments[0])
                activeCeilingElements.add(ceilingSegments[0])
            }
            if (binary[3] == '1') { // 0001: bottom-right
                activeWallElements.add(wallSegments[1])
                activeFloorElements.add(floorSegments[1])
                activeCeilingElements.add(ceilingSegments[1])
            }

            // Wall model
            def wallElementsJson = activeWallElements.collect { seg ->
                """        {
            "from": ${seg.from},
            "to": ${seg.to},
            "faces": {
                "north": {"uv": ${seg.faces.north.uv}, "texture": "${seg.faces.north.texture}"},
                "south": {"uv": ${seg.faces.south.uv}, "texture": "${seg.faces.south.texture}"}
            }
        }"""
            }.join(',\n')

            String wallModel = """{
    "format_version": "1.21.6",
    "credit": "Made with Blockbench",
    "render_type": "minecraft:cutout",
    "textures": {
        "texture": "bittermelon:block/sticky_note",
        "particle": "#texture"
    },
    "elements": [
${wallElementsJson}
    ]
}"""
            String wallFileName = "sticky_note_${binary}.json"
            new File(modelDirFile, wallFileName).text = wallModel

            // Floor model
            def floorElementsJson = activeFloorElements.collect { seg ->
                """        {
            "from": ${seg.from},
            "to": ${seg.to},
            "faces": {
                "up": {"uv": ${seg.faces.up.uv}, "texture": "${seg.faces.up.texture}"},
                "down": {"uv": ${seg.faces.down.uv}, "texture": "${seg.faces.down.texture}"}
            }
        }"""
            }.join(',\n')

            String floorModel = """{
    "format_version": "1.21.6",
    "credit": "Made with Blockbench",
    "render_type": "minecraft:cutout",
    "textures": {
        "texture": "bittermelon:block/sticky_note",
        "particle": "#texture"
    },
    "elements": [
${floorElementsJson}
    ]
}"""
            String floorFileName = "sticky_note_floor_${binary}.json"
            new File(modelDirFile, floorFileName).text = floorModel

            // Ceiling model
            def ceilingElementsJson = activeCeilingElements.collect { seg ->
                """        {
            "from": ${seg.from},
            "to": ${seg.to},
            "faces": {
                "up": {"uv": ${seg.faces.up.uv}, "texture": "${seg.faces.up.texture}"},
                "down": {"uv": ${seg.faces.down.uv}, "texture": "${seg.faces.down.texture}"}
            }
        }"""
            }.join(',\n')

            String ceilingModel = """{
    "format_version": "1.21.6",
    "credit": "Made with Blockbench",
    "render_type": "minecraft:cutout",
    "textures": {
        "texture": "bittermelon:block/sticky_note",
        "particle": "#texture"
    },
    "elements": [
${ceilingElementsJson}
    ]
}"""
            String ceilingFileName = "sticky_note_ceiling_${binary}.json"
            new File(modelDirFile, ceilingFileName).text = ceilingModel
        }
        println("Generated 16 sticky note wall, 16 floor, and 16 ceiling model files.")
    }
}
